name: nevate_portfolio
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_bloc: ^9.0.0
  sizer: ^3.0.5
  scrollable_positioned_list: ^0.3.8
  provider: ^6.1.2
  equatable: ^2.0.7
  animated_text_kit: ^4.2.3
  responsive_grid: ^2.4.4
  flutter_svg: ^2.2.3
  auto_size_text: ^3.0.0
  shared_preferences: ^2.5.3
  get: ^4.7.3
  flutter_lucide: ^1.7.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/data/
  #   - images/a_dot_ham.jpeg

  #==== FONT start ====#
  fonts:
    - family: Goodly
      fonts:
        - asset: assets/fonts/Goodly-Regular.ttf
          weight: 400
        - asset: assets/fonts/Goodly-Medium.ttf
          weight: 500
        - asset: assets/fonts/Goodly-Semibold.ttf
          weight: 700
        - asset: assets/fonts/Goodly-Bold.ttf
          weight: 900
